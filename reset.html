<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איפוס המוח השיווקי</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0b0f2e 0%, #1c2f82 55%, #2a1850 100%);
    color: #fff; font-family: "Assistant", "Segoe UI", sans-serif; padding: 24px 16px;
  }
  .card {
    max-width: 30rem; width: 100%; text-align: center;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22);
    border-radius: 20px; padding: 28px 22px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 10px; }
  p { font-size: .95rem; line-height: 1.7; opacity: .9; margin: 0 0 14px; }
  #log {
    text-align: right; font-size: .85rem; line-height: 1.9;
    background: rgba(0,0,0,.25); border-radius: 12px; padding: 12px 14px; margin-top: 14px;
  }
  a.go {
    display: inline-block; margin-top: 16px; padding: 14px 26px; border-radius: 12px;
    background: linear-gradient(135deg, #f0d6a3 0%, #d9ac5e 55%, #a97f36 100%);
    color: #2a1a45; font-weight: 800; text-decoration: none; font-size: 1rem;
  }
</style>
</head>
<body>
<div class="card">
  <h1>מאפסים את האפליקציה</h1>
  <p>
    זה מוחק את כל מה ששמור על המכשיר ומוריד את הגרסה החדשה מחדש.
    שום מידע לא נמחק, הכל שמור בענן.
  </p>
  <div id="log">מתחילים...</div>
  <a class="go" id="go" href="./" hidden>לפתוח את האפליקציה</a>
</div>

<script>
/* 23/10/2026 (מאיה: "זה חייב לעבוד במותקנת כי לכולם יש אפליקציה מותקנת").

   באפליקציה מותקנת סגירה ופתיחה לא תמיד מספיקות: ה-service worker הישן
   ממשיך לשלוט עד שגרסה חדשה מותקנת *ואז* נפתח חלון נוסף. מי שנתקעת על
   מסך הפתיחה לא מגיעה לשם לעולם, כי הדף עצמו לא מסיים להיטען.

   הדף הזה עומד בפני עצמו: בלי מודולים, בלי Firebase, בלי שום תלות
   שיכולה להישבר. הוא מנתק כל service worker, מוחק כל מטמון, ומחזיר
   לאפליקציה נקייה. כיוון שהוא באותו מקור, זה מתקן גם את האפליקציה
   המותקנת ולא רק את הטאב הזה. */
(function () {
  var log = document.getElementById('log');
  var lines = [];
  function say(t) { lines.push(t); log.innerHTML = lines.join('<br>'); }

  function finish() {
    say('✓ סיימנו. אפשר לפתוח את האפליקציה.');
    var go = document.getElementById('go');
    go.hidden = false;
    setTimeout(function () { window.location.replace('./?fresh=' + Date.now()); }, 2500);
  }

  var steps = [];

  steps.push(
    ('serviceWorker' in navigator)
      ? navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) { say('אין רכיב רקע להסיר'); return; }
          return Promise.all(regs.map(function (r) { return r.unregister(); }))
            .then(function () { say('✓ הוסרו ' + regs.length + ' רכיבי רקע'); });
        }).catch(function () { say('לא הצלחנו להסיר רכיב רקע, ממשיכים'); })
      : Promise.resolve(say('הדפדפן הזה בלי רכיב רקע'))
  );

  steps.push(
    (window.caches)
      ? caches.keys().then(function (keys) {
          if (!keys.length) { say('אין מטמון למחוק'); return; }
          return Promise.all(keys.map(function (k) { return caches.delete(k); }))
            .then(function () { say('✓ נמחקו ' + keys.length + ' מטמונים'); });
        }).catch(function () { say('לא הצלחנו למחוק מטמון, ממשיכים'); })
      : Promise.resolve(say('הדפדפן הזה בלי מטמון'))
  );

  /* גם אם משהו נתקע, לא נשאיר אותה מול מסך שלא זז */
  var safety = setTimeout(finish, 8000);
  Promise.all(steps).then(function () { clearTimeout(safety); finish(); })
    .catch(function () { clearTimeout(safety); finish(); });
})();
</script>
</body>
</html>
